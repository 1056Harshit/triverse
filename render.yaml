# Render Blueprint: TriVerse API on the free plan (Singapore, close to the Supabase Mumbai database).
# Secrets are not in this file — add them in Render → triverse-api → Environment → "Add from .env".
services:
  - type: web
    name: triverse-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_BUCKET
        value: triverse
      # whisper-small needs ~1 GB RAM; base fits the free plan's 512 MB.
      - key: WHISPER_MODEL
        value: onnx-community/whisper-base
      - key: SMS_ENABLED
        value: "true"
      - key: OTP_DEV_ECHO
        value: "false"

  # Website (pvtfrnd.com): landing pages + the web app at /app. Free static hosting, never sleeps.
  - type: web
    name: triverse-web
    runtime: static
    buildCommand: npm ci --no-audit --no-fund && npm run build -w @triverse/web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_API_URL
        value: https://triverse-api.onrender.com
    routes:
      - type: rewrite
        source: /app/*
        destination: /app/index.html
    headers:
      - path: /app/_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
